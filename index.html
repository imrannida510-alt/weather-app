<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Weather App - Imran Nida</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;color:white}
h1{margin-top:30px;font-size:36px}.sub{opacity:0.8;margin:10px 0 25px}
.box{width:100%;max-width:400px;background:white;border-radius:20px;padding:25px;color:#333;box-shadow:0 15px 35px rgba(0,0,0,0.2)}
.search{display:flex;gap:10px;margin-bottom:20px}
#city{flex:1;padding:14px;border:2px solid #eee;border-radius:12px;font-size:16px;outline:none}
#btn{padding:14px 20px;background:#667eea;color:white;border:none;border-radius:12px;font-weight:bold;cursor:pointer}
.result{text-align:center;padding:15px;display:none}
.result.show{display:block}
.temp{font-size:60px;font-weight:bold;color:#667eea}
.city-name{font-size:24px;margin:10px 0;text-transform:capitalize}
.desc{color:#666;text-transform:capitalize;font-size:18px}
.details{display:flex;justify-content:space-around;margin-top:20px;background:#f8f9fa;padding:15px;border-radius:12px}
.footer{margin-top:25px;font-size:13px;opacity:0.7}
</style>
</head>
<body>
<h1>Weather App</h1>
<p class="sub">Live Weather - No API Key Needed</p>
<div class="box">
<div class="search">
<input type="text" id="city" placeholder="Sirf sheher likhen: Karachi">
<button id="btn" onclick="getWeather()">Search</button>
</div>
<div id="result" class="result">
<div class="temp" id="temp">--°C</div>
<div class="city-name" id="cityName">--</div>
<div class="desc" id="desc">--</div>
<div class="details">
<div><span>Humidity</span><b id="hum">--%</b></div>
<div><span>Wind</span><b id="wind">-- km/h</b></div>
</div>
</div>
<p id="loading" style="text-align:center;color:#888;display:none">Loading...</p>
</div>
<p class="footer">Made by Imran Nida</p>
<script>
async function getWeather(){
let city = document.getElementById('city').value.trim();
if(!city) return alert("Sheher likhen!");
city = city.replace(/weather/gi,"").trim();
let resultDiv=document.getElementById('result');
let loading=document.getElementById('loading');
loading.style.display='block'; resultDiv.classList.remove('show');
try{
let geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${city}&count=1&language=en&format=json`);
let geoData = await geo.json();
if(!geoData.results) throw new Error("City not found");
let lat = geoData.results[0].latitude;
let lon = geoData.results[0].longitude;
let name = geoData.results[0].name;
let country = geoData.results[0].country;
let weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=relativehumidity_2m&timezone=auto`);
let weatherData = await weatherRes.json();
let temp = weatherData.current_weather.temperature;
let wind = weatherData.current_weather.windspeed;
let hum = weatherData.hourly.relativehumidity_2m[0];
document.getElementById('temp').innerText = temp + "°C";
document.getElementById('cityName').innerText = name + ", " + country;
document.getElementById('desc').innerText = "Live Temperature";
document.getElementById('wind').innerText = wind + " km/h";
document.getElementById('hum').innerText = hum + "%";
resultDiv.classList.add('show');
}catch(e){ alert("Sheher nahi mila, sirf naam likhen jaise: lahore"); }
loading.style.display='none';
}
document.getElementById('city').addEventListener("keypress", e=>{ if(e.key==="Enter") getWeather(); });
</script>
</body>
</html>
